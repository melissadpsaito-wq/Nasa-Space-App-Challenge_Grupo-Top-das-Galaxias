<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fire Almanac – Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mapa_filtros.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="{{ url_for('landing') }}">Fire<span>Almanac</span></a>
  </header>

  <main class="container">
    <!-- Barra de controles: botões de modo + busca -->
    <section class="controls">
      <div class="tab-group" role="tablist" aria-label="Modo de visualização">
        <button type="button" class="btn-tab active" role="tab" aria-selected="true" data-modo="historico">Histórico</button>
        <button type="button" class="btn-tab" role="tab" aria-selected="false" data-modo="timeline">TimeLine</button>
        <button type="button" class="btn-tab" role="tab" aria-selected="false" data-modo="previsao">Previsão</button>
      </div>

      <!-- Busca (ids exigidos pelo script do mapa) -->
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Buscar cidade ou região..." aria-label="Buscar cidade ou região" autocomplete="off">
        <ul id="autocomplete-list" class="autocomplete-dropdown"></ul>
      </div>
    </section>

    <!-- Filtros de data -->
    <form id="form-filtros" class="filters" novalidate>
      <div class="field">
        <label for="filtro-ano">Ano</label>
        <select id="filtro-ano" name="ano" required></select>
      </div>
      <div class="field">
        <label for="filtro-mes">Mês</label>
        <select id="filtro-mes" name="mes" required></select>
      </div>
      <div class="field" id="campo-dia">
        <label for="filtro-dia">Dia <small>(opcional)</small></label>
        <input type="number" id="filtro-dia" name="dia" min="1" max="31" placeholder="Mês inteiro">
      </div>
      <button type="submit" class="btn-apply">Aplicar filtros</button>
      <p id="filtro-status" role="status" aria-live="polite"></p>
    </form>

    <!-- Mapa centralizado: arraste com o mouse, use a roda ou os botões +/− para o zoom -->
    <section class="map-container">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/h3-js@4"></script>
  <!-- Mapa Leaflet + busca de região (substitui mapa.js e barra_busca.js nesta página) -->
  <script>
    // `map` é global para o mapa_cores.js poder desenhar os hexágonos H3
    let map;
    let marcadorAtual = null;

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Cria o mapa centrado no Brasil
      // Limites do mundo (o Mercator não passa de ~85° de latitude)
      const LIMITES_MUNDO = L.latLngBounds([-85.0511, -180], [85.0511, 180]);

      map = L.map('map', {
        maxBounds: LIMITES_MUNDO,    // não deixa arrastar para fora do mundo
        maxBoundsViscosity: 1.0,     // "parede" rígida nas bordas
        worldCopyJump: false,
        dragging: true,              // arrastar com o mouse/dedo
        scrollWheelZoom: true,       // zoom com a roda do mouse
        doubleClickZoom: true,
        touchZoom: true,
        zoomControl: true            // botões +/−
      }).setView([-15.7801, -47.9292], 4);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        noWrap: true,                // não repete o mapa nas laterais
        bounds: LIMITES_MUNDO,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Zoom mínimo = o menor zoom em que o mundo ainda preenche a tela inteira.
      // Recalculado ao redimensionar a janela.
      const ajustarZoomMinimo = () => {
        map.setMinZoom(map.getBoundsZoom(LIMITES_MUNDO, true));
        if (map.getZoom() <= map.getMinZoom()) map.setView(LIMITES_MUNDO.getCenter(), map.getMinZoom());
      };

      // No zoom mais afastado, centraliza o mapa
      map.on('zoomend', () => {
        if (map.getZoom() <= map.getMinZoom()) {
          map.panTo(LIMITES_MUNDO.getCenter(), { animate: true });
        }
      });

      map.whenReady(ajustarZoomMinimo);
      map.on('resize', ajustarZoomMinimo);

      setTimeout(() => { map.invalidateSize(); ajustarZoomMinimo(); }, 300); // evita tela cinza

      // 2. Busca de região (Nominatim)
      const input = document.getElementById('search-input');
      const lista = document.getElementById('autocomplete-list');
      let debounce;

      const buscar = (q) =>
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=15&accept-language=pt,en`)
          .then(r => r.json())
          .then(dados => {
            const classes = ['waterway', 'natural', 'boundary', 'place', 'landuse'];
            let res = dados.filter(l => classes.includes(l.class));
            // Se a busca tem acento, prefere resultados que o contenham (com fallback)
            if (/[\u00C0-\u00FF]/.test(q)) {
              const comAcento = res.filter(l => l.display_name.toLowerCase().includes(q.toLowerCase()));
              if (comAcento.length) res = comAcento;
            }
            return res;
          });

      input.addEventListener('input', () => {
        clearTimeout(debounce);
        if (input.value.length < 3) { lista.style.display = 'none'; return; }
        debounce = setTimeout(() => {
          buscar(input.value).then(res => mostrarSugestoes(res.slice(0, 5)))
                             .catch(e => console.error('Erro na busca:', e));
        }, 600);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        lista.style.display = 'none';
        if (!input.value.trim()) return;
        buscar(input.value).then(res => {
          if (res.length) irPara(res[0]);
          else alert('Lugar não encontrado.');
        }).catch(e => console.error('Erro na busca:', e));
      });

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !lista.contains(e.target)) lista.style.display = 'none';
      });

      function mostrarSugestoes(lugares) {
        lista.innerHTML = '';
        lugares.forEach(lugar => {
          const li = document.createElement('li');
          li.textContent = lugar.display_name;
          li.addEventListener('click', () => { lista.style.display = 'none'; irPara(lugar); });
          lista.appendChild(li);
        });
        lista.style.display = lugares.length ? 'block' : 'none';
      }

      function irPara(lugar) {
        input.value = lugar.display_name;
        moverMapa(lugar.lat, lugar.lon, lugar.display_name);
      }
    });

    // 3. Move o mapa até o lugar escolhido e marca com um pin
    function moverMapa(lat, lon, nome) {
      const pos = [parseFloat(lat), parseFloat(lon)];
      map.flyTo(pos, 10, { duration: 1.5 });
      if (marcadorAtual) map.removeLayer(marcadorAtual);
      marcadorAtual = L.marker(pos).addTo(map).bindPopup(`<b>${nome}</b>`).openPopup();
    }
  </script>
  <script src="{{ url_for('static', filename='js/mapa_cores.js') }}"></script>
  <script src="{{ url_for('static', filename='js/filtros.js') }}"></script>
</body>
</html>
